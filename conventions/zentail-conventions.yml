authentication:
  style: api-token
  detail: >-
    Open API requests carry an account API token (see authentication/zentail-authentication.yml).
    The Sales Channel / Listings API uses clientId + clientSecret.
reports:
  description: >-
    Bulk product/inventory import and export is performed through the Reports surface.
  operations:
  - method: POST
    path: /report
    summary: Submit a report job (bulk import or export).
    documented_parameters:
    - name: createNewProducts
      type: boolean
      note: When true, creates new SKUs for rows not already present.
    - name: overwriteWithBlank
      type: boolean
      note: When true, blank fields overwrite existing data.
    - name: isExport
      type: boolean
      note: true for an export report, false for an import.
    - name: data
      type: string
      note: Base64-encoded file content for import jobs.
    - name: delimiter
      type: string
      note: Field delimiter for the data payload (e.g. comma, pipe).
  - method: GET
    path: /report/{reportId}
    summary: Retrieve report data/status for a specific report ID.
    source: https://help.zentail.com/en/articles/1530976-using-the-reports-endpoint
